<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片批量压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #666;
            font-size: 1.1rem;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
        }

        .control-item label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .control-item input, .control-item select {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .control-item input:focus, .control-item select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: linear-gradient(45deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            color: #666;
            font-size: 0.95rem;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .image-item {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .image-item:hover {
            transform: translateY(-5px);
        }

        .image-preview {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .image-info {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
        }

        .image-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .compression-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .size-before, .size-after {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .size-before {
            background: #fee2e2;
            color: #dc2626;
        }

        .size-after {
            background: #dcfce7;
            color: #16a34a;
        }

        .savings {
            font-weight: 600;
            color: #16a34a;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 图片批量压缩工具</h1>
            <p>智能压缩模式，支持像素压缩、质量压缩或组合压缩</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-item">
                    <label>压缩模式</label>
                    <select id="compressionMode">
                        <option value="pixel">压缩像素</option>
                        <option value="quality">压缩质量</option>
                        <option value="both">压缩像素和质量</option>
                    </select>
                </div>
                <div class="control-item" id="pixelCompressionGroup">
                    <label>像素压缩比例</label>
                    <input type="range" id="pixelRatio" min="25" max="80" value="50">
                    <span id="pixelRatioValue">50%</span>
                </div>
                <div class="control-item" id="qualityGroup" style="display: none;">
                    <label>压缩质量</label>
                    <input type="range" id="quality" min="10" max="100" value="80">
                    <span id="qualityValue">80%</span>
                </div>
                <div class="control-item" id="maxDimensionsGroup" style="display: none;">
                    <label>最大宽度 (像素)</label>
                    <input type="number" id="maxWidth" value="1920" min="100" max="4000">
                </div>
                <div class="control-item" id="maxHeightGroup" style="display: none;">
                    <label>最大高度 (像素)</label>
                    <input type="number" id="maxHeight" value="1080" min="100" max="4000">
                </div>
                <div class="control-item">
                    <label>输出格式</label>
                    <select id="outputFormat">
                        <option value="original">保持原格式</option>
                        <option value="jpeg">JPEG</option>
                        <option value="webp">WebP</option>
                        <option value="png">PNG</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击选择图片或拖拽到此处</div>
            <div class="upload-hint">支持 JPG、PNG、WebP 格式，可同时选择多张图片</div>
        </div>

        <input type="file" id="fileInput" multiple accept="image/*">

        <div class="action-buttons">
            <button class="btn btn-primary" id="compressBtn" disabled>
                🗜️ 开始压缩
            </button>
            <button class="btn btn-secondary" id="downloadBtn" disabled>
                💾 下载压缩包
            </button>
            <button class="btn btn-secondary" id="clearBtn">
                🗑️ 清空列表
            </button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-item">
                <div class="stat-number" id="totalFiles">0</div>
                <div class="stat-label">总文件数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="originalSize">0 MB</div>
                <div class="stat-label">原始大小</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="compressedSize">0 MB</div>
                <div class="stat-label">压缩后大小</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="savings">0%</div>
                <div class="stat-label">节省空间</div>
            </div>
        </div>

        <div class="image-grid" id="imageGrid"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        class ImageCompressor {
            constructor() {
                this.files = [];
                this.compressedFiles = [];
                this.init();
            }

            init() {
                this.bindEvents();
                this.updatePixelRatioDisplay();
                this.updateQualityDisplay();
                this.handleModeChange(); // 初始化模式显示
            }

            bindEvents() {
                const uploadArea = document.getElementById('uploadArea');
                const fileInput = document.getElementById('fileInput');
                const compressionMode = document.getElementById('compressionMode');
                const pixelRatio = document.getElementById('pixelRatio');
                const quality = document.getElementById('quality');
                const compressBtn = document.getElementById('compressBtn');
                const downloadBtn = document.getElementById('downloadBtn');
                const clearBtn = document.getElementById('clearBtn');

                uploadArea.addEventListener('click', () => fileInput.click());
                uploadArea.addEventListener('dragover', this.handleDragOver.bind(this));
                uploadArea.addEventListener('drop', this.handleDrop.bind(this));
                uploadArea.addEventListener('dragleave', this.handleDragLeave.bind(this));

                fileInput.addEventListener('change', this.handleFileSelect.bind(this));
                compressionMode.addEventListener('change', this.handleModeChange.bind(this));
                pixelRatio.addEventListener('input', this.updatePixelRatioDisplay.bind(this));
                quality.addEventListener('input', this.updateQualityDisplay.bind(this));
                compressBtn.addEventListener('click', this.compressImages.bind(this));
                downloadBtn.addEventListener('click', this.downloadZip.bind(this));
                clearBtn.addEventListener('click', this.clearAll.bind(this));
            }

            handleDragOver(e) {
                e.preventDefault();
                document.getElementById('uploadArea').classList.add('dragover');
            }

            handleDragLeave() {
                document.getElementById('uploadArea').classList.remove('dragover');
            }

            handleDrop(e) {
                e.preventDefault();
                document.getElementById('uploadArea').classList.remove('dragover');
                this.handleFiles(e.dataTransfer.files);
            }

            handleFileSelect(e) {
                this.handleFiles(e.target.files);
            }

            handleFiles(fileList) {
                const newFiles = Array.from(fileList).filter(file => 
                    file.type.startsWith('image/')
                );
                
                this.files = [...this.files, ...newFiles];
                this.displayImages();
                this.updateControls();
            }

            displayImages() {
                const grid = document.getElementById('imageGrid');
                grid.innerHTML = '';

                this.files.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imageItem = this.createImageItem(file, e.target.result, index);
                        grid.appendChild(imageItem);
                    };
                    reader.readAsDataURL(file);
                });
            }

            createImageItem(file, src, index) {
                const item = document.createElement('div');
                item.className = 'image-item';
                item.innerHTML = `
                    <img src="${src}" alt="${file.name}" class="image-preview">
                    <div class="image-name">${file.name}</div>
                    <div class="image-info">
                        大小: ${this.formatFileSize(file.size)}<br>
                        类型: ${file.type}
                    </div>
                    <div class="compression-info" id="compression-${index}" style="display: none;">
                        <span class="size-before">${this.formatFileSize(file.size)}</span>
                        <span class="savings" id="savings-${index}"></span>
                        <span class="size-after" id="after-${index}"></span>
                    </div>
                `;
                return item;
            }

            handleModeChange() {
                const mode = document.getElementById('compressionMode').value;
                const pixelGroup = document.getElementById('pixelCompressionGroup');
                const qualityGroup = document.getElementById('qualityGroup');
                const maxDimensionsGroup = document.getElementById('maxDimensionsGroup');
                const maxHeightGroup = document.getElementById('maxHeightGroup');

                // 隐藏所有控制组
                pixelGroup.style.display = 'none';
                qualityGroup.style.display = 'none';
                maxDimensionsGroup.style.display = 'none';
                maxHeightGroup.style.display = 'none';

                // 根据模式显示相应控制组
                switch(mode) {
                    case 'pixel':
                        pixelGroup.style.display = 'flex';
                        break;
                    case 'quality':
                        qualityGroup.style.display = 'flex';
                        // 质量压缩模式不显示尺寸控制
                        break;
                    case 'both':
                        pixelGroup.style.display = 'flex';
                        qualityGroup.style.display = 'flex';
                        break;
                }
            }

            updatePixelRatioDisplay() {
                const pixelRatio = document.getElementById('pixelRatio').value;
                document.getElementById('pixelRatioValue').textContent = pixelRatio + '%';
            }

            updateQualityDisplay() {
                const quality = document.getElementById('quality').value;
                document.getElementById('qualityValue').textContent = quality + '%';
            }

            async compressImages() {
                if (this.files.length === 0) return;

                const compressBtn = document.getElementById('compressBtn');
                const progressBar = document.getElementById('progressBar');
                const progressFill = document.getElementById('progressFill');

                compressBtn.disabled = true;
                compressBtn.innerHTML = '🔄 压缩中...';
                progressBar.style.display = 'block';

                this.compressedFiles = [];
                let originalTotalSize = 0;
                let compressedTotalSize = 0;

                for (let i = 0; i < this.files.length; i++) {
                    const file = this.files[i];
                    originalTotalSize += file.size;

                    try {
                        const compressedBlob = await this.compressImage(file);
                        compressedTotalSize += compressedBlob.size;
                        
                        this.compressedFiles.push({
                            name: this.getOutputFileName(file),
                            blob: compressedBlob,
                            originalSize: file.size,
                            compressedSize: compressedBlob.size
                        });

                        this.updateImageItem(i, file.size, compressedBlob.size);
                    } catch (error) {
                        console.error('压缩失败:', error);
                    }

                    const progress = ((i + 1) / this.files.length) * 100;
                    progressFill.style.width = progress + '%';
                }

                this.updateStats(this.files.length, originalTotalSize, compressedTotalSize);
                
                compressBtn.disabled = false;
                compressBtn.innerHTML = '🗜️ 开始压缩';
                document.getElementById('downloadBtn').disabled = false;
                
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 1000);
            }

            async compressImage(file) {
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();

                    img.onload = () => {
                        const mode = document.getElementById('compressionMode').value;
                        const pixelRatio = parseInt(document.getElementById('pixelRatio').value) / 100;
                        const quality = parseInt(document.getElementById('quality').value) / 100;
                        const maxWidth = parseInt(document.getElementById('maxWidth').value);
                        const maxHeight = parseInt(document.getElementById('maxHeight').value);
                        const outputFormat = document.getElementById('outputFormat').value;

                        let { width, height } = this.calculateDimensions(
                            img.width, img.height, mode, pixelRatio, maxWidth, maxHeight
                        );

                        canvas.width = width;
                        canvas.height = height;

                        ctx.drawImage(img, 0, 0, width, height);

                        const mimeType = this.getMimeType(file, outputFormat);
                        
                        // 根据模式决定质量参数
                        let finalQuality;
                        switch(mode) {
                            case 'pixel':
                                finalQuality = 0.92; // 像素压缩时保持较高质量
                                break;
                            case 'quality':
                                finalQuality = quality;
                                break;
                            case 'both':
                                finalQuality = quality;
                                break;
                            default:
                                finalQuality = 0.8;
                        }
                        
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, mimeType, finalQuality);
                    };

                    img.src = URL.createObjectURL(file);
                });
            }

            calculateDimensions(originalWidth, originalHeight, mode, pixelRatio, maxWidth, maxHeight) {
                let width = originalWidth;
                let height = originalHeight;

                switch(mode) {
                    case 'pixel':
                        // 按比例缩放像素
                        width = Math.round(originalWidth * pixelRatio);
                        height = Math.round(originalHeight * pixelRatio);
                        break;
                    case 'quality':
                        // 质量压缩模式：保持原始尺寸，不进行像素缩放
                        width = originalWidth;
                        height = originalHeight;
                        break;
                    case 'both':
                        // 先按比例缩放像素
                        width = Math.round(originalWidth * pixelRatio);
                        height = Math.round(originalHeight * pixelRatio);
                        break;
                }

                return { width: Math.round(width), height: Math.round(height) };
            }

            getMimeType(file, outputFormat) {
                if (outputFormat === 'original') {
                    return file.type;
                }
                return `image/${outputFormat}`;
            }

            getOutputFileName(file) {
                const outputFormat = document.getElementById('outputFormat').value;
                if (outputFormat === 'original') {
                    return file.name;
                }
                
                const nameWithoutExt = file.name.replace(/\.[^/.]+$/, '');
                return `${nameWithoutExt}_compressed.${outputFormat}`;
            }

            updateImageItem(index, originalSize, compressedSize) {
                const compressionInfo = document.getElementById(`compression-${index}`);
                const savingsEl = document.getElementById(`savings-${index}`);
                const afterEl = document.getElementById(`after-${index}`);

                if (compressionInfo && savingsEl && afterEl) {
                    const savings = ((originalSize - compressedSize) / originalSize * 100);
                    
                    savingsEl.textContent = `节省 ${savings.toFixed(1)}%`;
                    afterEl.textContent = this.formatFileSize(compressedSize);
                    compressionInfo.style.display = 'flex';
                }
            }

            updateStats(totalFiles, originalSize, compressedSize) {
                const stats = document.getElementById('stats');
                const savings = originalSize > 0 ? ((originalSize - compressedSize) / originalSize * 100) : 0;

                document.getElementById('totalFiles').textContent = totalFiles;
                document.getElementById('originalSize').textContent = this.formatFileSize(originalSize);
                document.getElementById('compressedSize').textContent = this.formatFileSize(compressedSize);
                document.getElementById('savings').textContent = savings.toFixed(1) + '%';

                stats.style.display = 'grid';
            }

            async downloadZip() {
                if (this.compressedFiles.length === 0) return;

                const zip = new JSZip();
                
                this.compressedFiles.forEach(file => {
                    zip.file(file.name, file.blob);
                });

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                
                const url = URL.createObjectURL(zipBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `compressed_images_${Date.now()}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            clearAll() {
                this.files = [];
                this.compressedFiles = [];
                document.getElementById('imageGrid').innerHTML = '';
                document.getElementById('stats').style.display = 'none';
                this.updateControls();
            }

            updateControls() {
                const hasFiles = this.files.length > 0;
                document.getElementById('compressBtn').disabled = !hasFiles;
                document.getElementById('downloadBtn').disabled = this.compressedFiles.length === 0;
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', () => {
            new ImageCompressor();
        });
    </script>
</body>
</html>
