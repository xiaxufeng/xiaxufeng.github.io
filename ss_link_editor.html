<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS链接信息修改器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-grid-full {
            grid-column: 1 / -1;
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #36d1dc, #5b86e5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-group button {
            flex: 1;
            min-width: 200px;
        }

        .result-area {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .success {
            color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .copy-btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
            margin-right: 10px;
        }

        .qr-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
        }

        .qr-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .qr-modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .qr-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .qr-close:hover {
            color: #000;
        }

        #qrcode {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        .qr-options {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            font-size: 14px;
        }

        .qr-options select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group button {
                min-width: auto;
            }

            .qr-options {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 SS链接信息修改器</h1>
        
        <div class="section">
            <div class="section-title">📋 粘贴原始SS链接</div>
            <div class="input-group">
                <textarea id="originalSS" placeholder="请粘贴原始的SS链接...&#10;例如: ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ@192.168.1.1:8388#服务器名称"></textarea>
                <button class="btn-primary" onclick="parseSSLink()">🔍 解析SS链接</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⚙️ 修改服务器信息</div>
            <div class="form-grid">
                <div class="input-group">
                    <label for="method">加密方式</label>
                    <select id="method">
                        <option value="aes-256-gcm">aes-256-gcm</option>
                        <option value="aes-192-gcm">aes-192-gcm</option>
                        <option value="aes-128-gcm">aes-128-gcm</option>
                        <option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</option>
                        <option value="xchacha20-ietf-poly1305">xchacha20-ietf-poly1305</option>
                        <option value="aes-256-cfb">aes-256-cfb</option>
                        <option value="aes-192-cfb">aes-192-cfb</option>
                        <option value="aes-128-cfb">aes-128-cfb</option>
                        <option value="rc4-md5">rc4-md5</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="text" id="password" placeholder="输入服务器密码">
                </div>
                <div class="input-group">
                    <label for="server">服务器地址</label>
                    <input type="text" id="server" placeholder="例如: 192.168.1.1">
                </div>
                <div class="input-group">
                    <label for="port">端口</label>
                    <input type="number" id="port" placeholder="例如: 8388" min="1" max="65535">
                </div>
                <div class="input-group form-grid-full">
                    <label for="remark">备注名称</label>
                    <input type="text" id="remark" placeholder="输入服务器备注名称">
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🚀 生成新链接</div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="generateSSLink()">✨ 生成新的SS链接</button>
            </div>
            <div id="result" class="result-area" style="display: none;">
                <div id="resultText"></div>
                <button class="copy-btn" onclick="copyToClipboard()">📋 复制链接</button>
                <button class="qr-btn" onclick="showQRCode()">📱 生成二维码</button>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <!-- 二维码模态框 -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <span class="qr-close" onclick="closeQRModal()">&times;</span>
            <h3 style="margin-bottom: 20px; color: #333;">📱 SS链接二维码</h3>
            <div class="qr-options">
                <label for="errorCorrectionLevel">容错率:</label>
                <select id="errorCorrectionLevel">
                    <option value="L">低 (L)</option>
                    <option value="M">中 (M)</option>
                    <option value="Q">高 (Q)</option>
                    <option value="H">最高 (H)</option>
                </select>
                <button onclick="regenerateQRCode()" style="padding: 4px 12px; font-size: 12px; margin: 0;">重新生成</button>
            </div>
            <div id="qrcode"></div>
            <p style="color: #666; font-size: 14px; margin-top: 15px;">
                使用SS客户端扫描此二维码即可导入配置
            </p>
        </div>
    </div>

    <script>
        let parsedData = {};

        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function parseSSLink() {
            const input = document.getElementById('originalSS').value.trim();
            
            if (!input) {
                showMessage('请先输入SS链接！');
                return;
            }

            try {
                // 检查是否是有效的SS链接
                if (!input.startsWith('ss://')) {
                    throw new Error('无效的SS链接格式，链接必须以 ss:// 开头');
                }

                // 解析SS链接
                const ssUrl = input.substring(5); // 移除 'ss://'
                let linkPart, remark = '';
                
                // 分离链接主体和备注
                if (ssUrl.includes('#')) {
                    const hashIndex = ssUrl.indexOf('#');
                    linkPart = ssUrl.substring(0, hashIndex);
                    remark = decodeURIComponent(ssUrl.substring(hashIndex + 1));
                } else {
                    linkPart = ssUrl;
                }

                console.log('链接主体部分:', linkPart);

                // SS链接有两种格式：
                // 1. ss://base64(method:password)@server:port
                // 2. ss://base64(method:password@server:port)
                
                let method, password, server, port;

                if (linkPart.includes('@')) {
                    // 格式1: ss://base64(method:password)@server:port
                    const [userInfoPart, serverPart] = linkPart.split('@');
                    
                    if (!userInfoPart || !serverPart) {
                        throw new Error('链接格式错误，用户信息或服务器信息缺失');
                    }

                    // 解码Base64用户信息
                    let decodedUserInfo;
                    try {
                        decodedUserInfo = atob(userInfoPart);
                    } catch (e) {
                        throw new Error('Base64解码失败，用户信息格式可能不正确');
                    }

                    console.log('解码后的用户信息:', decodedUserInfo);

                    // 解析加密方式和密码
                    const colonIndex = decodedUserInfo.indexOf(':');
                    if (colonIndex === -1) {
                        throw new Error('用户信息格式错误，缺少冒号分隔符');
                    }

                    method = decodedUserInfo.substring(0, colonIndex);
                    password = decodedUserInfo.substring(colonIndex + 1);

                    // 解析服务器地址和端口
                    const lastColonIndex = serverPart.lastIndexOf(':');
                    if (lastColonIndex === -1) {
                        throw new Error('服务器信息格式错误，缺少端口号');
                    }
                    
                    server = serverPart.substring(0, lastColonIndex);
                    port = serverPart.substring(lastColonIndex + 1);

                } else {
                    // 格式2: ss://base64(method:password@server:port)
                    let decodedInfo;
                    try {
                        decodedInfo = atob(linkPart);
                    } catch (e) {
                        throw new Error('Base64解码失败，链接格式可能不正确');
                    }

                    console.log('解码后的完整信息:', decodedInfo);

                    // 查找@符号
                    const atIndex = decodedInfo.indexOf('@');
                    if (atIndex === -1) {
                        throw new Error('解码后的信息中缺少@符号，链接格式不正确');
                    }

                    // 分离用户信息和服务器信息
                    const userInfo = decodedInfo.substring(0, atIndex);
                    const serverInfo = decodedInfo.substring(atIndex + 1);

                    // 解析加密方式和密码
                    const colonIndex = userInfo.indexOf(':');
                    if (colonIndex === -1) {
                        throw new Error('用户信息格式错误，缺少冒号分隔符');
                    }

                    method = userInfo.substring(0, colonIndex);
                    password = userInfo.substring(colonIndex + 1);

                    // 解析服务器地址和端口
                    const lastColonIndex = serverInfo.lastIndexOf(':');
                    if (lastColonIndex === -1) {
                        throw new Error('服务器信息格式错误，缺少端口号');
                    }
                    
                    server = serverInfo.substring(0, lastColonIndex);
                    port = serverInfo.substring(lastColonIndex + 1);
                }

                // 验证解析结果
                if (!method || !password || !server || !port) {
                    throw new Error('解析结果不完整：方法、密码、服务器地址或端口号缺失');
                }

                // 验证端口号
                const portNum = parseInt(port);
                if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                    throw new Error('端口号必须是1-65535之间的数字');
                }

                console.log('解析结果:', { method, password, server, port, remark });

                // 填充表单
                document.getElementById('method').value = method;
                document.getElementById('password').value = password;
                document.getElementById('server').value = server;
                document.getElementById('port').value = portNum; // 确保端口是数字
                document.getElementById('remark').value = remark;

                parsedData = { method, password, server, port: portNum, remark };
                showMessage('SS链接解析成功！可以开始修改配置信息。', 'success');

            } catch (error) {
                showMessage(`解析失败: ${error.message}`);
                console.error('解析错误:', error);
                // 显示原始链接供调试
                console.log('原始输入:', input);
            }
        }

        function generateSSLink() {
            // 获取表单数据
            const method = document.getElementById('method').value;
            const password = document.getElementById('password').value;
            const server = document.getElementById('server').value;
            const port = document.getElementById('port').value;
            const remark = document.getElementById('remark').value;

            // 验证必填字段
            if (!method || !password || !server || !port) {
                showMessage('请填写完整的服务器信息（加密方式、密码、服务器地址、端口）');
                return;
            }

            // 验证端口范围
            const portNum = parseInt(port);
            if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                showMessage('端口号必须在1-65535之间');
                return;
            }

            try {
                // 使用格式2构建SS链接: ss://base64(method:password@server:port)#remark
                const fullInfo = `${method}:${password}@${server}:${port}`;
                const encodedInfo = btoa(fullInfo);
                
                let ssLink = `ss://${encodedInfo}`;
                
                if (remark) {
                    ssLink += `#${encodeURIComponent(remark)}`;
                }

                // 显示结果
                const resultDiv = document.getElementById('result');
                const resultText = document.getElementById('resultText');
                
                resultText.innerHTML = `
                    <strong>生成的SS链接（格式2）：</strong><br>
                    <div style="margin-top: 10px; padding: 10px; background: white; border-radius: 5px; word-break: break-all;">
                        ${ssLink}
                    </div>
                    <br>
                    <strong>编码信息：</strong><br>
                    • 原始字符串: ${fullInfo}<br>
                    • Base64编码: ${encodedInfo}<br>
                    <br>
                    <strong>配置信息：</strong><br>
                    • 加密方式: ${method}<br>
                    • 密码: ${password}<br>
                    • 服务器: ${server}<br>
                    • 端口: ${port}<br>
                    • 备注: ${remark || '无'}<br>
                    • 链接格式: 格式2 (完整信息Base64编码)
                `;
                
                resultDiv.style.display = 'block';
                showMessage('新的SS链接生成成功！！（使用格式2）', 'success');

                // 保存到全局变量供复制和二维码使用
                window.generatedLink = ssLink;

            } catch (error) {
                showMessage(`生成失败: ${error.message}`);
                console.error('生成错误:', error);
            }
        }

        function copyToClipboard() {
            if (!window.generatedLink) {
                showMessage('没有可复制的链接');
                return;
            }

            navigator.clipboard.writeText(window.generatedLink).then(function() {
                showMessage('链接已复制到剪贴板！', 'success');
            }).catch(function(err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = window.generatedLink;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showMessage('链接已复制到剪贴板！', 'success');
                } catch (err) {
                    showMessage('复制失败，请手动复制链接');
                }
                document.body.removeChild(textArea);
            });
        }

        function showQRCode() {
            if (!window.generatedLink) {
                showMessage('请先生成SS链接');
                return;
            }

            const modal = document.getElementById('qrModal');
            modal.style.display = 'block';
            generateQRCode();
        }

        function generateQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            const errorCorrectionLevel = document.getElementById('errorCorrectionLevel').value;
            
            // 清空之前的二维码
            qrcodeDiv.innerHTML = '';
            
            // 生成二维码
            try {
                // 使用qrcode-generator库
                const qr = qrcode(0, errorCorrectionLevel);
                qr.addData(window.generatedLink);
                qr.make();
                
                // 创建二维码图片
                const qrSize = 8; // 每个模块的像素大小
                const padding = 20; // 白边宽度
                const qrCanvas = document.createElement('canvas');
                const ctx = qrCanvas.getContext('2d');
                const moduleCount = qr.getModuleCount();
                const qrCodeSize = moduleCount * qrSize;
                const canvasSize = qrCodeSize + (padding * 2);
                
                qrCanvas.width = canvasSize;
                qrCanvas.height = canvasSize;
                qrCanvas.style.borderRadius = '12px';
                qrCanvas.style.boxShadow = '0 8px 25px rgba(0, 0, 0, 0.15)';
                qrCanvas.style.background = 'white';
                
                // 先填充整个画布为白色背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvasSize, canvasSize);
                
                // 绘制二维码（居中显示，周围有白边）
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        ctx.fillStyle = qr.isDark(row, col) ? '#000000' : '#ffffff';
                        ctx.fillRect(
                            padding + col * qrSize, 
                            padding + row * qrSize, 
                            qrSize, 
                            qrSize
                        );
                    }
                }
                
                // 创建容器div用于更好的样式控制
                const qrContainer = document.createElement('div');
                qrContainer.style.cssText = `
                    display: inline-block;
                    padding: 10px;
                    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                    border-radius: 15px;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                `;
                qrContainer.appendChild(qrCanvas);
                qrcodeDiv.appendChild(qrContainer);
                
            } catch (error) {
                console.error('二维码生成错误:', error);
                
                // 降级方案：使用在线二维码生成API
                try {
                    const encodedData = encodeURIComponent(window.generatedLink);
                    const qrImg = document.createElement('img');
                    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=256x256&data=${encodedData}&ecc=${errorCorrectionLevel}&margin=2`;
                    qrImg.alt = 'SS链接二维码';
                    qrImg.style.cssText = `
                        border-radius: 12px;
                        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
                        background: white;
                        padding: 0;
                        margin: 0;
                    `;
                    
                    // 创建美化容器
                    const qrContainer = document.createElement('div');
                    qrContainer.style.cssText = `
                        display: inline-block;
                        padding: 15px;
                        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                        border-radius: 15px;
                        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                    `;
                    
                    qrImg.onload = function() {
                        qrContainer.appendChild(qrImg);
                        qrcodeDiv.appendChild(qrContainer);
                    };
                    qrImg.onerror = function() {
                        showMessage('二维码生成失败，请检查网络连接或手动复制链接');
                    };
                } catch (fallbackError) {
                    console.error('降级方案也失败:', fallbackError);
                    showMessage('二维码生成失败，请手动复制链接使用');
                }
            }
        }

        function regenerateQRCode() {
            generateQRCode();
        }

        function closeQRModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // 输入框实时验证
        document.getElementById('port').addEventListener('input', function(e) {
            const port = parseInt(e.target.value);
            if (isNaN(port) || port < 1 || port > 65535) {
                e.target.style.borderColor = '#e74c3c';
            } else {
                e.target.style.borderColor = '#e1e5e9';
            }
        });

        // 快捷键支持
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                if (document.getElementById('originalSS').value) {
                    parseSSLink();
                } else {
                    generateSSLink();
                }
            }
            // ESC关闭二维码模态框
            if (e.key === 'Escape') {
                closeQRModal();
            }
        });
