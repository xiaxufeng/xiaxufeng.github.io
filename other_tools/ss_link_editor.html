<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS链接信息修改器 - 增强版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .version-tag {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .label-with-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            font-size: 12px;
            color: #999;
            font-weight: normal;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-grid-full {
            grid-column: 1 / -1;
        }

        .plugin-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .plugin-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .plugin-toggle {
            margin-right: 10px;
        }

        .plugin-fields {
            display: none;
            animation: slideDown 0.3s ease;
        }

        .plugin-fields.active {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #36d1dc, #5b86e5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-group button {
            flex: 1;
            min-width: 200px;
        }

        .result-area {
            background: #f8f9fa;
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .success {
            color: #27ae60;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .warning {
            color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid rgba(243, 156, 18, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

        .copy-btn {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
            margin-right: 10px;
        }

        .qr-btn {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
        }

        .qr-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .qr-modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .qr-close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .qr-close:hover {
            color: #000;
        }

        #qrcode {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }

        .qr-options {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            font-size: 14px;
            flex-wrap: wrap;
        }

        .qr-options label {
            margin: 0;
            font-weight: 500;
            color: #555;
        }

        .qr-options select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            width: auto;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .form-grid, .plugin-fields.active {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 2rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn-group button {
                min-width: auto;
            }

            .qr-options {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 SS链接信息修改器</h1>
        <div class="version-tag">增强版 v2.0 - 支持Simple-obfs插件</div>
        
        <div class="section">
            <div class="section-title">📋 粘贴原始SS链接</div>
            <div class="input-group">
                <textarea id="originalSS" placeholder="请粘贴原始的SS链接...&#10;例如: ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ@192.168.1.1:8388#服务器名称&#10;或包含插件: ss://YWVzLTI1Ni1nY206cGFzc3dvcmQ@192.168.1.1:8388/?plugin=obfs-local%3Bobfs%3Dhttp%3Bobfs-host%3Dexample.com#服务器名称"></textarea>
                <button class="btn-primary" onclick="parseSSLink()">🔍 解析SS链接</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⚙️ 修改服务器信息</div>
            <div class="form-grid">
                <div class="input-group">
                    <label for="method">加密方式</label>
                    <select id="method">
                        <optgroup label="AEAD 加密 (推荐)">
                            <option value="aes-128-gcm">aes-128-gcm</option>
                            <option value="aes-192-gcm">aes-192-gcm</option>
                            <option value="aes-256-gcm">aes-256-gcm</option>
                            <option value="chacha20-ietf-poly1305">chacha20-ietf-poly1305</option>
                            <option value="xchacha20-ietf-poly1305">xchacha20-ietf-poly1305</option>
                            <option value="2022-blake3-aes-128-gcm">2022-blake3-aes-128-gcm</option>
                            <option value="2022-blake3-aes-256-gcm">2022-blake3-aes-256-gcm</option>
                            <option value="2022-blake3-chacha20-poly1305">2022-blake3-chacha20-poly1305</option>
                        </optgroup>
                        <optgroup label="XChacha20 系列">
                            <option value="xchacha20-poly1305">xchacha20-poly1305</option>
                            <option value="xchacha20-ietf-poly1305">xchacha20-ietf-poly1305</option>
                        </optgroup>
                        <optgroup label="Blake3 系列 (最新)">
                            <option value="blake3-aes-128-gcm">blake3-aes-128-gcm</option>
                            <option value="blake3-aes-256-gcm">blake3-aes-256-gcm</option>
                            <option value="blake3-chacha20-poly1305">blake3-chacha20-poly1305</option>
                        </optgroup>
                        <optgroup label="Stream 加密">
                            <option value="aes-128-cfb">aes-128-cfb</option>
                            <option value="aes-192-cfb">aes-192-cfb</option>
                            <option value="aes-256-cfb">aes-256-cfb</option>
                            <option value="aes-128-ctr">aes-128-ctr</option>
                            <option value="aes-192-ctr">aes-192-ctr</option>
                            <option value="aes-256-ctr">aes-256-ctr</option>
                            <option value="camellia-128-cfb">camellia-128-cfb</option>
                            <option value="camellia-192-cfb">camellia-192-cfb</option>
                            <option value="camellia-256-cfb">camellia-256-cfb</option>
                            <option value="bf-cfb">bf-cfb</option>
                            <option value="chacha20">chacha20</option>
                            <option value="chacha20-ietf">chacha20-ietf</option>
                            <option value="salsa20">salsa20</option>
                            <option value="rc4-md5">rc4-md5</option>
                        </optgroup>
                        <optgroup label="其他">
                            <option value="none">none (不加密)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="input-group">
                    <label for="password">密码</label>
                    <input type="text" id="password" placeholder="输入服务器密码">
                </div>
                <div class="input-group">
                    <label for="server">服务器地址</label>
                    <input type="text" id="server" placeholder="例如: 192.168.1.1 或 example.com">
                </div>
                <div class="input-group">
                    <label for="port">端口</label>
                    <input type="number" id="port" placeholder="例如: 8388" min="1" max="65535">
                </div>
                <div class="input-group form-grid-full">
                    <label for="remark">备注名称</label>
                    <input type="text" id="remark" placeholder="输入服务器备注名称">
                </div>
            </div>

            <div class="plugin-section">
                <div class="plugin-header">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="enablePlugin" onchange="togglePlugin()">
                        <label for="enablePlugin" style="margin: 0; cursor: pointer;">
                            <strong>启用 Simple-obfs 插件</strong>
                        </label>
                    </div>
                </div>
                <div class="plugin-fields" id="pluginFields">
                    <div class="input-group">
                        <div class="label-with-hint">
                            <label for="pluginName">插件名称</label>
                            <span class="hint">常用: obfs-local, v2ray-plugin</span>
                        </div>
                        <select id="pluginName">
                            <option value="obfs-local">obfs-local (Simple-obfs)</option>
                            <option value="v2ray-plugin">v2ray-plugin</option>
                            <option value="kcptun">kcptun</option>
                            <option value="goquiet">goquiet</option>
                            <option value="cloak">cloak</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="obfsMode">混淆模式</label>
                        <select id="obfsMode">
                            <option value="http">HTTP</option>
                            <option value="tls">TLS</option>
                            <option value="websocket">WebSocket (v2ray)</option>
                            <option value="quic">QUIC (v2ray)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <div class="label-with-hint">
                            <label for="obfsHost">混淆域名</label>
                            <span class="hint">例: cloudflare.com</span>
                        </div>
                        <input type="text" id="obfsHost" placeholder="例如: cloudflare.com, bing.com">
                    </div>
                    <div class="input-group">
                        <div class="label-with-hint">
                            <label for="obfsUri">URI路径</label>
                            <span class="hint">可选，HTTP模式可用</span>
                        </div>
                        <input type="text" id="obfsUri" placeholder="例如: /video (可留空)">
                    </div>
                    <div class="input-group form-grid-full">
                        <div class="label-with-hint">
                            <label for="pluginOpts">其他插件参数</label>
                            <span class="hint">高级选项，分号分隔</span>
                        </div>
                        <input type="text" id="pluginOpts" placeholder="例如: mux=0;fast-open=true (可留空)">
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">🚀 生成新链接</div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="generateSSLink()">✨ 生成新的SS链接</button>
            </div>
            <div id="result" class="result-area" style="display: none;">
                <div id="resultText"></div>
                <button class="copy-btn" onclick="copyToClipboard()">📋 复制链接</button>
                <button class="qr-btn" onclick="showQRCode()">📱 生成二维码</button>
            </div>
        </div>

        <div id="message"></div>
    </div>

    <!-- 二维码模态框 -->
    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <span class="qr-close" onclick="closeQRModal()">&times;</span>
            <h3 style="margin-bottom: 20px; color: #333;">📱 SS链接二维码</h3>
            <div class="qr-options">
                <label for="linkFormat">链接格式:</label>
                <select id="linkFormat" onchange="regenerateQRCode()">
                    <option value="format1">格式1 (推荐)</option>
                    <option value="format2">格式2 (备用)</option>
                </select>
                <label for="errorCorrectionLevel">容错率:</label>
                <select id="errorCorrectionLevel">
                    <option value="L">低 (L)</option>
                    <option value="M">中 (M)</option>
                    <option value="Q">高 (Q)</option>
                    <option value="H">最高 (H)</option>
                </select>
                <button onclick="regenerateQRCode()" style="padding: 4px 12px; font-size: 12px; margin: 0;">重新生成</button>
            </div>
            <div id="qrcode"></div>
            <p style="color: #666; font-size: 14px; margin-top: 15px;">
                使用SS客户端扫描此二维码即可导入配置
            </p>
        </div>
    </div>

    <script>
        let parsedData = {};

        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        function togglePlugin() {
            const checkbox = document.getElementById('enablePlugin');
            const pluginFields = document.getElementById('pluginFields');
            
            if (checkbox.checked) {
                pluginFields.classList.add('active');
            } else {
                pluginFields.classList.remove('active');
            }
        }

        function parsePluginString(pluginStr) {
            // 解析插件参数字符串，例如: obfs-local;obfs=http;obfs-host=example.com
            const params = {};
            const parts = decodeURIComponent(pluginStr).split(';');
            
            // 第一部分是插件名称
            params.pluginName = parts[0];
            
            // 解析其余参数
            for (let i = 1; i < parts.length; i++) {
                const [key, value] = parts[i].split('=');
                if (key && value) {
                    params[key] = value;
                }
            }
            
            return params;
        }

        function parseSSLink() {
            const input = document.getElementById('originalSS').value.trim();
            
            if (!input) {
                showMessage('请先输入SS链接！');
                return;
            }

            try {
                // 检查是否是有效的SS链接
                if (!input.startsWith('ss://')) {
                    throw new Error('无效的SS链接格式，链接必须以 ss:// 开头');
                }

                // 解析SS链接
                let ssUrl = input.substring(5); // 移除 'ss://'
                let linkPart, remark = '', pluginInfo = '';
                
                // 先分离备注（#后的部分）
                if (ssUrl.includes('#')) {
                    const hashIndex = ssUrl.indexOf('#');
                    remark = decodeURIComponent(ssUrl.substring(hashIndex + 1));
                    ssUrl = ssUrl.substring(0, hashIndex);
                }
                
                // 检查是否包含插件参数（?plugin=或&plugin=）
                if (ssUrl.includes('?plugin=') || ssUrl.includes('&plugin=')) {
                    const pluginIndex = ssUrl.indexOf('?plugin=') !== -1 ? ssUrl.indexOf('?plugin=') : ssUrl.indexOf('&plugin=');
                    const pluginStartIndex = pluginIndex + (ssUrl.indexOf('?plugin=') !== -1 ? 8 : 8);
                    pluginInfo = ssUrl.substring(pluginStartIndex);
                    linkPart = ssUrl.substring(0, pluginIndex);
                    
                    // 处理可能存在的其他查询参数
                    if (pluginInfo.includes('&')) {
                        pluginInfo = pluginInfo.substring(0, pluginInfo.indexOf('&'));
                    }
                } else if (ssUrl.includes('/')) {
                    // 处理包含路径的情况（有时插件参数在路径后）
                    const slashIndex = ssUrl.indexOf('/');
                    linkPart = ssUrl.substring(0, slashIndex);
                    const pathPart = ssUrl.substring(slashIndex);
                    if (pathPart.includes('?plugin=')) {
                        const pluginIndex = pathPart.indexOf('?plugin=');
                        pluginInfo = pathPart.substring(pluginIndex + 8);
                    }
                } else {
                    linkPart = ssUrl;
                }

                console.log('链接主体部分:', linkPart);
                console.log('插件信息:', pluginInfo);

                let method, password, server, port;

                if (linkPart.includes('@')) {
                    // 格式1: ss://base64(method:password)@server:port
                    const [userInfoPart, serverPart] = linkPart.split('@');
                    
                    if (!userInfoPart || !serverPart) {
                        throw new Error('链接格式错误，用户信息或服务器信息缺失');
                    }

                    // 解码Base64用户信息
                    let decodedUserInfo;
                    try {
                        decodedUserInfo = atob(userInfoPart);
                    } catch (e) {
                        throw new Error('Base64解码失败，用户信息格式可能不正确');
                    }

                    console.log('解码后的用户信息:', decodedUserInfo);

                    // 解析加密方式和密码
                    const colonIndex = decodedUserInfo.indexOf(':');
                    if (colonIndex === -1) {
                        throw new Error('用户信息格式错误，缺少冒号分隔符');
                    }

                    method = decodedUserInfo.substring(0, colonIndex);
                    password = decodedUserInfo.substring(colonIndex + 1);

                    // 解析服务器地址和端口
                    const lastColonIndex = serverPart.lastIndexOf(':');
                    if (lastColonIndex === -1) {
                        throw new Error('服务器信息格式错误，缺少端口号');
                    }
                    
                    server = serverPart.substring(0, lastColonIndex);
                    port = serverPart.substring(lastColonIndex + 1);

                } else {
                    // 格式2: ss://base64(method:password@server:port)
                    let decodedInfo;
                    try {
                        decodedInfo = atob(linkPart);
                    } catch (e) {
                        throw new Error('Base64解码失败，链接格式可能不正确');
                    }

                    console.log('解码后的完整信息:', decodedInfo);

                    // 查找@符号
                    const atIndex = decodedInfo.lastIndexOf('@');
                    if (atIndex === -1) {
                        throw new Error('解码后的信息中缺少@符号，链接格式不正确');
                    }

                    // 分离用户信息和服务器信息
                    const userInfo = decodedInfo.substring(0, atIndex);
                    const serverInfo = decodedInfo.substring(atIndex + 1);

                    // 解析加密方式和密码
                    const colonIndex = userInfo.indexOf(':');
                    if (colonIndex === -1) {
                        throw new Error('用户信息格式错误，缺少冒号分隔符');
                    }

                    method = userInfo.substring(0, colonIndex);
                    password = userInfo.substring(colonIndex + 1);

                    // 解析服务器地址和端口
                    const lastColonIndex = serverInfo.lastIndexOf(':');
                    if (lastColonIndex === -1) {
                        throw new Error('服务器信息格式错误，缺少端口号');
                    }
                    
                    server = serverInfo.substring(0, lastColonIndex);
                    port = serverInfo.substring(lastColonIndex + 1);
                }

                // 验证解析结果
                if (!method || !password || !server || !port) {
                    throw new Error('解析结果不完整：方法、密码、服务器地址或端口号缺失');
                }

                // 验证端口号
                const portNum = parseInt(port);
                if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                    throw new Error('端口号必须是1-65535之间的数字');
                }

                console.log('解析结果:', { method, password, server, port, remark, pluginInfo });

                // 填充表单
                document.getElementById('method').value = method;
                document.getElementById('password').value = password;
                document.getElementById('server').value = server;
                document.getElementById('port').value = portNum;
                document.getElementById('remark').value = remark;

                // 解析并填充插件信息
                if (pluginInfo) {
                    const pluginParams = parsePluginString(pluginInfo);
                    console.log('解析的插件参数:', pluginParams);
                    
                    document.getElementById('enablePlugin').checked = true;
                    togglePlugin();
                    
                    // 设置插件名称
                    if (pluginParams.pluginName) {
                        const pluginSelect = document.getElementById('pluginName');
                        // 尝试匹配选项，如果没有匹配的就使用第一个
                        let optionFound = false;
                        for (let option of pluginSelect.options) {
                            if (option.value === pluginParams.pluginName) {
                                pluginSelect.value = pluginParams.pluginName;
                                optionFound = true;
                                break;
                            }
                        }
                        if (!optionFound) {
                            showMessage(`插件 ${pluginParams.pluginName} 不在预设列表中，已选择默认插件`, 'warning');
                        }
                    }
                    
                    // 设置混淆模式
                    if (pluginParams.obfs) {
                        document.getElementById('obfsMode').value = pluginParams.obfs;
                    }
                    
                    // 设置混淆域名
                    if (pluginParams['obfs-host']) {
                        document.getElementById('obfsHost').value = pluginParams['obfs-host'];
                    }
                    
                    // 设置URI路径
                    if (pluginParams['obfs-uri'] || pluginParams.uri) {
                        document.getElementById('obfsUri').value = pluginParams['obfs-uri'] || pluginParams.uri;
                    }
                    
                    // 处理其他参数
                    const otherParams = [];
                    for (const [key, value] of Object.entries(pluginParams)) {
                        if (!['pluginName', 'obfs', 'obfs-host', 'obfs-uri', 'uri'].includes(key)) {
                            otherParams.push(`${key}=${value}`);
                        }
                    }
                    if (otherParams.length > 0) {
                        document.getElementById('pluginOpts').value = otherParams.join(';');
                    }
                } else {
                    document.getElementById('enablePlugin').checked = false;
                    togglePlugin();
                }

                                parsedData = { method, password, server, port: portNum, remark };
                showMessage('SS链接解析成功！可以开始修改配置信息。', 'success');

            } catch (error) {
                showMessage(`解析失败: ${error.message}`);
                console.error('解析错误:', error);
                // 显示原始链接供调试
                console.log('原始输入:', input);
            }
        }

        function generateSSLink() {
            // 获取表单数据
            const method = document.getElementById('method').value;
            const password = document.getElementById('password').value;
            const server = document.getElementById('server').value;
            const port = document.getElementById('port').value;
            const remark = document.getElementById('remark').value;
            const enablePlugin = document.getElementById('enablePlugin').checked;

            // 验证必填字段
            if (!method || !password || !server || !port) {
                showMessage('请填写完整的服务器信息（加密方式、密码、服务器地址、端口）');
                return;
            }

            // 验证端口范围
            const portNum = parseInt(port);
            if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                showMessage('端口号必须在1-65535之间');
                return;
            }

            try {
                // 构建基础SS链接
                const userInfo = `${method}:${password}`;
                const encodedUserInfo = btoa(userInfo);
                
                let ssLink = `ss://${encodedUserInfo}@${server}:${port}`;
                
                // 添加插件参数
                if (enablePlugin) {
                    const pluginName = document.getElementById('pluginName').value;
                    const obfsMode = document.getElementById('obfsMode').value;
                    const obfsHost = document.getElementById('obfsHost').value;
                    const obfsUri = document.getElementById('obfsUri').value;
                    const pluginOpts = document.getElementById('pluginOpts').value;
                    
                    if (!pluginName || !obfsMode) {
                        showMessage('请填写插件名称和混淆模式');
                        return;
                    }
                    
                    // 构建插件参数字符串
                    let pluginStr = pluginName;
                    pluginStr += `;obfs=${obfsMode}`;
                    
                    if (obfsHost) {
                        pluginStr += `;obfs-host=${obfsHost}`;
                    }
                    
                    if (obfsUri && obfsMode === 'http') {
                        pluginStr += `;obfs-uri=${obfsUri}`;
                    }
                    
                    // 添加其他插件参数
                    if (pluginOpts) {
                        const extraOpts = pluginOpts.split(';').filter(opt => opt.trim());
                        for (const opt of extraOpts) {
                            if (opt.includes('=')) {
                                pluginStr += `;${opt.trim()}`;
                            }
                        }
                    }
                    
                    ssLink += `/?plugin=${encodeURIComponent(pluginStr)}`;
                }
                
                // 添加备注
                if (remark) {
                    ssLink += `#${encodeURIComponent(remark)}`;
                }
                
                // 同时生成格式2的链接（完整信息Base64编码）
                const fullInfo = `${method}:${password}@${server}:${port}`;
                const encodedFullInfo = btoa(fullInfo);
                let ssLinkFormat2 = `ss://${encodedFullInfo}`;
                
                if (enablePlugin) {
                    const pluginName = document.getElementById('pluginName').value;
                    const obfsMode = document.getElementById('obfsMode').value;
                    const obfsHost = document.getElementById('obfsHost').value;
                    const obfsUri = document.getElementById('obfsUri').value;
                    const pluginOpts = document.getElementById('pluginOpts').value;
                    
                    let pluginStr = pluginName;
                    pluginStr += `;obfs=${obfsMode}`;
                    
                    if (obfsHost) {
                        pluginStr += `;obfs-host=${obfsHost}`;
                    }
                    
                    if (obfsUri && obfsMode === 'http') {
                        pluginStr += `;obfs-uri=${obfsUri}`;
                    }
                    
                    if (pluginOpts) {
                        const extraOpts = pluginOpts.split(';').filter(opt => opt.trim());
                        for (const opt of extraOpts) {
                            if (opt.includes('=')) {
                                pluginStr += `;${opt.trim()}`;
                            }
                        }
                    }
                    
                    ssLinkFormat2 += `/?plugin=${encodeURIComponent(pluginStr)}`;
                }
                
                if (remark) {
                    ssLinkFormat2 += `#${encodeURIComponent(remark)}`;
                }

                // 显示结果
                const resultDiv = document.getElementById('result');
                const resultText = document.getElementById('resultText');
                
                let pluginInfoHtml = '';
                if (enablePlugin) {
                    const pluginName = document.getElementById('pluginName').value;
                    const obfsMode = document.getElementById('obfsMode').value;
                    const obfsHost = document.getElementById('obfsHost').value || '无';
                    const obfsUri = document.getElementById('obfsUri').value || '无';
                    
                    pluginInfoHtml = `
                    <br>
                    <strong>插件配置信息：</strong><br>
                    • 插件名称: ${pluginName}<br>
                    • 混淆模式: ${obfsMode}<br>
                    • 混淆域名: ${obfsHost}<br>
                    • URI路径: ${obfsUri}<br>`;
                }
                
                resultText.innerHTML = `
                    <strong>生成的SS链接（格式1 - 推荐）：</strong><br>
                    <div style="margin-top: 10px; padding: 10px; background: white; border-radius: 5px; word-break: break-all;">
                        ${ssLink}
                    </div>
                    <br>
                    <strong>备用SS链接（格式2）：</strong><br>
                    <div style="margin-top: 10px; padding: 10px; background: white; border-radius: 5px; word-break: break-all;">
                        ${ssLinkFormat2}
                    </div>
                    <br>
                    <strong>配置信息：</strong><br>
                    • 加密方式: ${method}<br>
                    • 密码: ${password}<br>
                    • 服务器: ${server}<br>
                    • 端口: ${port}<br>
                    • 备注: ${remark || '无'}<br>
                    ${pluginInfoHtml}
                `;
                
                resultDiv.style.display = 'block';
                showMessage('新的SS链接生成成功！（提供两种格式供选择）', 'success');

                // 保存到全局变量供复制和二维码使用
                window.generatedLink = ssLink;
                window.generatedLinkFormat1 = ssLink;
                window.generatedLinkFormat2 = ssLinkFormat2;

            } catch (error) {
                showMessage(`生成失败: ${error.message}`);
                console.error('生成错误:', error);
            }
        }

        function copyToClipboard() {
            if (!window.generatedLink) {
                showMessage('没有可复制的链接');
                return;
            }

            navigator.clipboard.writeText(window.generatedLink).then(function() {
                showMessage('链接已复制到剪贴板！', 'success');
            }).catch(function(err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = window.generatedLink;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showMessage('链接已复制到剪贴板！', 'success');
                } catch (err) {
                    showMessage('复制失败，请手动复制链接');
                }
                document.body.removeChild(textArea);
            });
        }

        function showQRCode() {
            if (!window.generatedLink) {
                showMessage('请先生成SS链接');
                return;
            }

            const modal = document.getElementById('qrModal');
            modal.style.display = 'block';
            generateQRCode();
        }

        function generateQRCode() {
            const qrcodeDiv = document.getElementById('qrcode');
            const errorCorrectionLevel = document.getElementById('errorCorrectionLevel').value;
            const linkFormat = document.getElementById('linkFormat').value;
            
            // 根据选择的格式决定使用哪个链接
            let linkToEncode = window.generatedLink;
            if (linkFormat === 'format2' && window.generatedLinkFormat2) {
                linkToEncode = window.generatedLinkFormat2;
            } else if (linkFormat === 'format1' && window.generatedLinkFormat1) {
                linkToEncode = window.generatedLinkFormat1;
            }
            
            // 清空之前的二维码
            qrcodeDiv.innerHTML = '';
            
            // 生成二维码
            try {
                // 使用qrcode-generator库
                const qr = qrcode(0, errorCorrectionLevel);
                qr.addData(linkToEncode);
                qr.make();
                
                // 创建二维码图片
                const qrSize = 8; // 每个模块的像素大小
                const padding = 20; // 白边宽度
                const qrCanvas = document.createElement('canvas');
                const ctx = qrCanvas.getContext('2d');
                const moduleCount = qr.getModuleCount();
                const qrCodeSize = moduleCount * qrSize;
                const canvasSize = qrCodeSize + (padding * 2);
                
                qrCanvas.width = canvasSize;
                qrCanvas.height = canvasSize;
                qrCanvas.style.borderRadius = '12px';
                qrCanvas.style.boxShadow = '0 8px 25px rgba(0, 0, 0, 0.15)';
                qrCanvas.style.background = 'white';
                
                // 先填充整个画布为白色背景
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvasSize, canvasSize);
                
                // 绘制二维码（居中显示，周围有白边）
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        ctx.fillStyle = qr.isDark(row, col) ? '#000000' : '#ffffff';
                        ctx.fillRect(
                            padding + col * qrSize, 
                            padding + row * qrSize, 
                            qrSize, 
                            qrSize
                        );
                    }
                }
                
                // 创建容器div用于更好的样式控制
                const qrContainer = document.createElement('div');
                qrContainer.style.cssText = `
                    display: inline-block;
                    padding: 10px;
                    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                    border-radius: 15px;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                `;
                qrContainer.appendChild(qrCanvas);
                qrcodeDiv.appendChild(qrContainer);
                
                // 添加格式说明
                //const formatInfo = document.createElement('p');
                //formatInfo.style.cssText = 'color: #888; font-size: 12px; margin-top: 10px;';
                //formatInfo.textContent = `当前使用: ${linkFormat === 'format2' ? '格式2 (完整Base64)' : '格式1 (分离式)'}`;
                //qrcodeDiv.appendChild(formatInfo);
                
            } catch (error) {
                console.error('二维码生成错误:', error);
                showMessage('二维码生成失败，请手动复制链接使用');
            }
        }

        function regenerateQRCode() {
            generateQRCode();
        }

        function closeQRModal() {
            document.getElementById('qrModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('qrModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // 输入框实时验证
        document.getElementById('port').addEventListener('input', function(e) {
            const port = parseInt(e.target.value);
            if (isNaN(port) || port < 1 || port > 65535) {
                e.target.style.borderColor = '#e74c3c';
            } else {
                e.target.style.borderColor = '#e1e5e9';
            }
        });

        // 监听插件名称变化，自动调整相关选项
        document.getElementById('pluginName').addEventListener('change', function(e) {
            const pluginName = e.target.value;
            const obfsModeSelect = document.getElementById('obfsMode');
            
            // 根据不同插件调整可用的混淆模式
            if (pluginName === 'v2ray-plugin') {
                obfsModeSelect.innerHTML = `
                    <option value="websocket">WebSocket</option>
                    <option value="quic">QUIC</option>
                    <option value="http">HTTP</option>
                `;
            } else if (pluginName === 'obfs-local') {
                obfsModeSelect.innerHTML = `
                    <option value="http">HTTP</option>
                    <option value="tls">TLS</option>
                `;
            } else {
                // 其他插件使用通用选项
                obfsModeSelect.innerHTML = `
                    <option value="http">HTTP</option>
                    <option value="tls">TLS</option>
                    <option value="websocket">WebSocket</option>
                    <option value="quic">QUIC</option>
                `;
            }
        });

        // 快捷键支持
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                if (document.getElementById('originalSS').value) {
                    parseSSLink();
                } else {
                    generateSSLink();
                }
            }
            // ESC关闭二维码模态框
            if (e.key === 'Escape') {
                closeQRModal();
            }
        });
    </script>
