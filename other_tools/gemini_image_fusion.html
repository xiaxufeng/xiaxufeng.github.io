<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图片融合工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            min-height: 100vh;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .panel h2 {
            font-size: 24px;
            margin-bottom: 25px;
            color: #2d3748;
            text-align: center;
            position: relative;
        }

        .panel h2::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #f7fafc, #edf2f7);
            position: relative;
            overflow: hidden;
        }

        .upload-box:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
        }

        .upload-box.has-image {
            padding: 0;
            border: 3px solid #48bb78;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .upload-icon {
            font-size: 48px;
            color: #a0aec0;
        }

        .upload-text {
            font-size: 16px;
            color: #4a5568;
            font-weight: 500;
        }

        .upload-hint {
            font-size: 12px;
            color: #718096;
        }

        .preview-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }

        .options-section {
            margin-bottom: 25px;
        }

        .api-key-section {
            margin-bottom: 25px;
        }

        .api-key-input-group {
            position: relative;
            margin-bottom: 10px;
        }

        .api-key-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            background: white;
        }

        .api-key-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .api-key-input.valid {
            border-color: #48bb78;
            background: linear-gradient(145deg, #f0fff4, #c6f6d5);
        }

        .api-key-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .api-key-toggle:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .api-key-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #718096;
        }

        .status-indicator {
            font-size: 8px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            color: #48bb78;
        }

        .status-indicator.error {
            color: #e53e3e;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .preset-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .preset-option {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: white;
            position: relative;
            overflow: hidden;
        }

        .preset-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .preset-option:hover::before {
            left: 100%;
        }

        .preset-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .preset-option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .preset-option.selected .preset-emoji {
            transform: scale(1.2);
        }

        .preset-emoji {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
            transition: transform 0.3s ease;
        }

        .custom-prompt {
            margin-bottom: 25px;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 100px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            resize: vertical;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .generate-btn:hover::before {
            left: 100%;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.3);
        }

        .generate-btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-area {
            text-align: center;
            position: relative;
        }

        .result-placeholder {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 60px 30px;
            background: linear-gradient(145deg, #f7fafc, #edf2f7);
            margin-bottom: 20px;
        }

        .result-placeholder-icon {
            font-size: 64px;
            color: #a0aec0;
            margin-bottom: 20px;
        }

        .result-placeholder-text {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 10px;
        }

        .result-placeholder-hint {
            font-size: 14px;
            color: #718096;
        }

        .result-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .result-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 24px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .action-btn.primary {
            background: #667eea;
            color: white;
        }

        .action-btn.primary:hover {
            background: #5a67d8;
        }

        .loading {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .status-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 15px;
            }

            .upload-grid {
                grid-template-columns: 1fr;
            }

            .preset-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧控制面板 -->
        <div class="panel">
            <h2>🎨 图片融合设置</h2>
            
            <div class="upload-section">
                <div class="upload-grid">
                    <!-- 场景图上传 -->
                    <div class="upload-box" id="sceneUpload">
                        <input type="file" id="sceneFile" accept="image/*">
                        <div class="upload-content" id="sceneContent">
                            <span class="upload-icon">🖼️</span>
                            <div class="upload-text">场景图片</div>
                            <div class="upload-hint">点击上传场景图</div>
                        </div>
                    </div>
                    
                    <!-- 印花图案上传 -->
                    <div class="upload-box" id="patternUpload">
                        <input type="file" id="patternFile" accept="image/*">
                        <div class="upload-content" id="patternContent">
                            <span class="upload-icon">✨</span>
                            <div class="upload-text">印花图案</div>
                            <div class="upload-hint">点击上传印花图</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="options-section">
                <div class="section-title">API 设置</div>
                <div class="api-key-section">
                    <div class="api-key-input-group">
                        <input type="password" 
                               class="api-key-input" 
                               placeholder="请输入 Gemini API Key"
                               id="apiKeyInput">
                        <button class="api-key-toggle" id="apiKeyToggle" type="button">👁️</button>
                    </div>
                    <div class="api-key-status" id="apiKeyStatus">
                        <span class="status-indicator" id="statusIndicator">⚪</span>
                        <span class="status-text" id="statusText">未设置API密钥</span>
                    </div>
                </div>
            </div>

            <div class="options-section">
                <div class="section-title">任务预设</div>
                <div class="preset-options">
                    <div class="preset-option" data-preset="ceramic">
                        <span class="preset-emoji">☕</span>
                        <div>印花到陶瓷杯</div>
                    </div>
                    <div class="preset-option" data-preset="tshirt">
                        <span class="preset-emoji">👕</span>
                        <div>印花到T恤</div>
                    </div>
                </div>
            </div>

            <div class="custom-prompt">
                <div class="section-title">自定义提示词</div>
                <textarea class="prompt-textarea" 
                          placeholder="在这里输入自定义的融合要求，例如：调整印花的大小、位置、透明度等..."
                          id="customPrompt"></textarea>
            </div>

            <button class="generate-btn" id="generateBtn" disabled>
                🚀 开始生成
            </button>
            
            <div class="status-message" id="statusMessage" style="display: none;"></div>
        </div>

        <!-- 右侧结果面板 -->
        <div class="panel">
            <h2>✨ 生成结果</h2>
            
            <div class="result-area">
                <div class="result-placeholder" id="resultPlaceholder">
                    <div class="result-placeholder-icon">🎯</div>
                    <div class="result-placeholder-text">等待生成结果</div>
                    <div class="result-placeholder-hint">上传图片并选择预设后开始生成</div>
                </div>
                
                <div class="loading" id="loadingIndicator">
                    <div class="spinner"></div>
                    <div>AI正在处理图片...</div>
                </div>
                
                <img class="result-image" id="resultImage" style="display: none;">
                
                <div class="result-actions" id="resultActions" style="display: none;">
                    <button class="action-btn" onclick="regenerate()">🔄 重新生成</button>
                    <button class="action-btn primary" onclick="downloadResult()">📥 下载图片</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let sceneImage = null;
        let patternImage = null;
        let selectedPreset = null;
        let resultImageData = null;
        let GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || '';

        const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeUpload();
            initializePresets();
            initializeApiKey();
        });

        // 初始化上传功能
        function initializeUpload() {
            const sceneUpload = document.getElementById('sceneUpload');
            const sceneFile = document.getElementById('sceneFile');
            
            sceneUpload.addEventListener('click', () => sceneFile.click());
            sceneFile.addEventListener('change', (e) => handleImageUpload(e, 'scene'));

            const patternUpload = document.getElementById('patternUpload');
            const patternFile = document.getElementById('patternFile');
            
            patternUpload.addEventListener('click', () => patternFile.click());
            patternFile.addEventListener('change', (e) => handleImageUpload(e, 'pattern'));

            document.getElementById('generateBtn').addEventListener('click', generateImage);
        }

        // 初始化预设选择
        function initializePresets() {
            const presetOptions = document.querySelectorAll('.preset-option');
            presetOptions.forEach(option => {
                option.addEventListener('click', () => selectPreset(option));
            });
        }

        // 初始化API密钥功能
        function initializeApiKey() {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const apiKeyToggle = document.getElementById('apiKeyToggle');
            
            if (GEMINI_API_KEY) {
                apiKeyInput.value = GEMINI_API_KEY;
                updateApiKeyStatus('valid', '✅', 'API密钥已设置');
                apiKeyInput.classList.add('valid');
            }
            
            apiKeyToggle.addEventListener('click', () => {
                const isPassword = apiKeyInput.type === 'password';
                apiKeyInput.type = isPassword ? 'text' : 'password';
                apiKeyToggle.textContent = isPassword ? '🙈' : '👁️';
            });
            
            apiKeyInput.addEventListener('input', (e) => {
                const value = e.target.value.trim();
                
                if (value) {
                    GEMINI_API_KEY = value;
                    localStorage.setItem('gemini_api_key', value);
                    updateApiKeyStatus('valid', '✅', 'API密钥已保存');
                    apiKeyInput.classList.add('valid');
                } else {
                    GEMINI_API_KEY = '';
                    localStorage.removeItem('gemini_api_key');
                    updateApiKeyStatus('', '⚪', '未设置API密钥');
                    apiKeyInput.classList.remove('valid');
                }
                
                updateGenerateButton();
            });
            
            apiKeyInput.addEventListener('blur', () => {
                if (GEMINI_API_KEY && !isValidApiKey(GEMINI_API_KEY)) {
                    updateApiKeyStatus('error', '❌', 'API密钥格式可能不正确');
                }
            });
        }

        // 处理图片上传
        function handleImageUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                
                if (type === 'scene') {
                    sceneImage = imageData;
                    updateUploadBox('sceneUpload', 'sceneContent', imageData, '场景图片已上传');
                } else if (type === 'pattern') {
                    patternImage = imageData;
                    updateUploadBox('patternUpload', 'patternContent', imageData, '印花图案已上传');
                }
                
                updateGenerateButton();
            };
            reader.readAsDataURL(file);
        }

        // 更新上传框显示
        function updateUploadBox(boxId, contentId, imageData, successText) {
            const box = document.getElementById(boxId);
            const content = document.getElementById(contentId);
            
            box.classList.add('has-image');
            content.innerHTML = `<img src="${imageData}" class="preview-image" alt="预览图片">`;
            
            showStatusMessage(successText, 'success');
        }

        // 选择预设
        function selectPreset(option) {
            document.querySelectorAll('.preset-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            option.classList.add('selected');
            selectedPreset = option.dataset.preset;
            
            updateCustomPrompt();
            updateGenerateButton();
        }

        // 更新自定义提示词
        function updateCustomPrompt() {
            const promptTextarea = document.getElementById('customPrompt');
            const presetPrompts = {
                ceramic: '将印花图案自然地融合到陶瓷杯表面，保持图案的清晰度和色彩饱和度，考虑杯子的曲面特征',
                tshirt: '将印花图案完美地印制在T恤上，保持图案比例协调，颜色鲜艳，符合服装印花的真实效果'
            };
            
            if (selectedPreset && presetPrompts[selectedPreset]) {
                promptTextarea.value = presetPrompts[selectedPreset];
            }
        }

        // 更新生成按钮状态
        function updateGenerateButton() {
            const generateBtn = document.getElementById('generateBtn');
            const canGenerate = sceneImage && patternImage && selectedPreset && GEMINI_API_KEY;
            
            generateBtn.disabled = !canGenerate;
            
            if (!GEMINI_API_KEY) {
                generateBtn.textContent = '请先设置API密钥';
            } else if (!sceneImage || !patternImage) {
                generateBtn.textContent = '请上传两张图片';
            } else if (!selectedPreset) {
                generateBtn.textContent = '请选择预设类型';
            } else {
                generateBtn.textContent = '🚀 开始生成';
            }
        }

        // 工具函数
        function getImageBase64(dataUrl) {
            return dataUrl.split(',')[1];
        }

        function getImageMimeType(dataUrl) {
            const match = dataUrl.match(/data:([^;]+);/);
            return match ? match[1] : 'image/jpeg';
        }

        function updateApiKeyStatus(type, indicator, text) {
            const statusIndicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            statusIndicator.textContent = indicator;
            statusIndicator.className = `status-indicator ${type}`;
            statusText.textContent = text;
        }
        
        function isValidApiKey(key) {
            return key.startsWith('AIza') && key.length > 30;
        }

        // 构建完整提示词
        function buildFullPrompt(preset, customPrompt) {
            const basePrompts = {
                ceramic: `Using the two input images provided, create a realistic product mockup by seamlessly applying the pattern/design from the second image onto the ceramic mug shown in the first image. The final result should look like a professional product photo where:

- The pattern is naturally wrapped around the curved surface of the mug
- The design follows the mug's geometry and perspective correctly  
- Lighting and shadows are consistent with the original mug photo
- The pattern colors and details are preserved but adapted to the ceramic surface
- The final image looks like an authentic printed ceramic mug product

Generate a high-quality product mockup image as output.`,
                
                tshirt: `Using the two input images provided, create a realistic apparel mockup by applying the pattern/design from the second image onto the t-shirt shown in the first image. The final result should be a professional fashion mockup where:

- The pattern is properly positioned on the t-shirt (typically center chest)
- The design follows the fabric contours and fit naturally
- The scale and proportions are appropriate for t-shirt printing
- Colors remain vibrant and true to the original pattern
- Fabric texture and realistic printing effects are maintained
- The result looks like an actual printed t-shirt product

Generate a high-quality apparel mockup image as output.`
            };

            let fullPrompt = basePrompts[preset] || basePrompts.tshirt;
            
            if (customPrompt && customPrompt.trim()) {
                fullPrompt += `\n\nAdditional customization requirements: ${customPrompt}`;
            }
            
            return fullPrompt;
        }

        // Gemini API调用
        async function callGeminiAPI(sceneImage, patternImage, customPrompt) {
            if (!GEMINI_API_KEY) {
                throw new Error('请先设置Gemini API密钥');
            }

            const fullPrompt = buildFullPrompt(selectedPreset, customPrompt);
            
            const requestBody = {
                contents: [{
                    parts: [
                        { 
                            inline_data: { 
                                mime_type: getImageMimeType(sceneImage), 
                                data: getImageBase64(sceneImage) 
                            } 
                        },
                        { 
                            inline_data: { 
                                mime_type: getImageMimeType(patternImage), 
                                data: getImageBase64(patternImage) 
                            } 
                        },
                        { text: fullPrompt }
                    ]
                }],
                generationConfig: {
                    temperature: 0.7,
                    topK: 32,
                    topP: 1,
                    maxOutputTokens: 4096,
                }
            };

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                // 详细的响应处理
                console.log('API响应状态:', response.status, response.statusText);

                if (!response.ok) {
                    let errorMessage = `HTTP错误 ${response.status}: ${response.statusText}`;
                    
                    try {
                        const errorData = await response.json();
                        console.error('API错误详情:', errorData);
                        
                        if (errorData.error) {
                            if (errorData.error.message) {
                                errorMessage = `API错误: ${errorData.error.message}`;
                            }
                            if (errorData.error.code) {
                                errorMessage += ` (错误代码: ${errorData.error.code})`;
                            }
                            if (errorData.error.status) {
                                errorMessage += ` (状态: ${errorData.error.status})`;
                            }
                        }
                    } catch (parseError) {
                        console.error('无法解析错误响应:', parseError);
                        errorMessage += ' (无法获取详细错误信息)';
                    }
                    
                    throw new Error(errorMessage);
                }

                const result = await response.json();
                console.log('API成功响应:', result);
                
                if (result.candidates && result.candidates[0] && result.candidates[0].content) {
                    const parts = result.candidates[0].content.parts;
                    console.log('响应parts:', parts);
                    
                    for (const part of parts) {
                        if (part.inline_data && part.inline_data.data) {
                            const mimeType = part.inline_data.mime_type || 'image/png';
                            return `data:${mimeType};base64,${part.inline_data.data}`;
                        }
                        if (part.inlineData && part.inlineData.data) {
                            const mimeType = part.inlineData.mimeType || 'image/png';
                            return `data:${mimeType};base64,${part.inlineData.data}`;
                        }
                    }
                    
                    const textParts = parts.filter(part => part.text);
                    if (textParts.length > 0) {
                        const textContent = textParts.map(p => p.text).join(' ');
                        console.log('API文本响应:', textContent);
                        throw new Error(`模型返回了文本而非图片: ${textContent.substring(0, 200)}${textContent.length > 200 ? '...' : ''}`);
                    }
                    
                    throw new Error('API响应中未找到图片数据');
                } else {
                    console.error('API响应格式异常:', result);
                    
                    // 检查是否有错误信息
                    if (result.error) {
                        throw new Error(`API错误: ${result.error.message || result.error}`);
                    }
                    
                    throw new Error(`API响应格式异常: ${JSON.stringify(result).substring(0, 200)}...`);
                }
                
            } catch (error) {
                console.error('Gemini API调用错误:', error);
                throw error;
            }
        }

        // 生成图片
        async function generateImage() {
            const customPrompt = document.getElementById('customPrompt').value;
            
            showLoading(true);
            hideStatusMessage();
            
            try {
                const resultImageData = await callGeminiAPI(sceneImage, patternImage, customPrompt);
                
                displayResult(resultImageData);
                showStatusMessage('图片生成成功！', 'success');
                
            } catch (error) {
                console.error('生成失败:', error);
                
                let errorMessage = '生成失败，请检查设置后重试';
                
                // 详细的错误信息处理
                if (error.message.includes('API密钥')) {
                    errorMessage = '请在左侧输入有效的Gemini API密钥';
                } else if (error.message.includes('quota') || error.message.includes('exceeded')) {
                    errorMessage = 'API配额不足，请稍后再试或检查计费设置';
                } else if (error.message.includes('PERMISSION_DENIED')) {
                    errorMessage = 'API密钥权限不足，请检查密钥配置';
                } else if (error.message.includes('INVALID_ARGUMENT')) {
                    errorMessage = '请求参数错误，请检查图片格式和大小';
                } else if (error.message.includes('网络')) {
                    errorMessage = '网络连接失败，请检查网络设置';
                } else if (error.message.includes('API调用失败:')) {
                    // 直接显示API返回的错误信息
                    errorMessage = error.message;
                } else if (error.message) {
                    // 显示完整的错误信息
                    errorMessage = `生成失败: ${error.message}`;
                }
                
                showStatusMessage(errorMessage, 'error');
                
                // 在控制台输出完整错误信息用于调试
                console.error('完整错误信息:', {
                    message: error.message,
                    stack: error.stack,
                    name: error.name
                });
                
            } finally {
                showLoading(false);
            }
        }

        // 显示结果
        function displayResult(imageData) {
            resultImageData = imageData;
            
            const placeholder = document.getElementById('resultPlaceholder');
            const resultImage = document.getElementById('resultImage');
            const actions = document.getElementById('resultActions');
            
            placeholder.style.display = 'none';
            resultImage.src = imageData;
            resultImage.style.display = 'block';
            actions.style.display = 'flex';
        }

        // 显示加载状态
        function showLoading(show) {
            const loading = document.getElementById('loadingIndicator');
            loading.style.display = show ? 'block' : 'none';
        }

        // 显示状态消息
        function showStatusMessage(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
        }

        // 隐藏状态消息
        function hideStatusMessage() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.style.display = 'none';
        }

        // 重新生成
        function regenerate() {
            generateImage();
        }

        // 下载结果
        function downloadResult() {
            if (!resultImageData) return;
            
            const link = document.createElement('a');
            link.download = `fusion_result_${Date.now()}.png`;
            link.href = resultImageData;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showStatusMessage('图片下载中...', 'success');
        }
    </script>
</body>
</html>
